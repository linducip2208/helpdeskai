name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: PHP 8.3 + Node build + tests
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, json, mbstring, openssl, pcre, pdo_sqlite, sqlite3, tokenizer, xml, intl
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install PHP dependencies
        run: COMPOSER_NO_SCRIPTS=1 composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run tests (sqlite :memory:)
        run: php artisan test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

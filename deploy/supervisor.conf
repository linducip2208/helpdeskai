; Supervisor configuration for HelpDesk AI
; Copy to /etc/supervisor/conf.d/helpdeskai.conf then:
;   supervisorctl reread && supervisorctl update && supervisorctl start all

[program:helpdeskai-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/helpdeskai/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/helpdeskai/storage/logs/queue-worker.log
stopwaitsecs=3600

; Optional: run the scheduler under supervisor instead of cron.
; If you already added the `schedule:run` cron entry, DO NOT enable this.
[program:helpdeskai-scheduler]
process_name=%(program_name)s
command=php /var/www/helpdeskai/artisan schedule:work
autostart=false
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/helpdeskai/storage/logs/scheduler.log

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — HelpDesk AI</title>
<style>
:root{color-scheme:light dark}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#0f172a;color:#f1f5f9;padding:24px}
.card{max-width:480px;text-align:center;background:#1e293b;border-radius:16px;padding:48px 32px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.icon{font-size:56px;margin-bottom:16px}
h1{font-size:22px;font-weight:700;margin:0 0 8px}
p{color:#94a3b8;margin:0 0 24px;line-height:1.5}
button{background:#38bdf8;color:#0f172a;font-weight:600;border:0;padding:10px 24px;border-radius:8px;cursor:pointer}
button:hover{background:#0ea5e9}
</style>
</head>
<body>
<div class="card">
<div class="icon">📡</div>
<h1>You're offline</h1>
<p>HelpDesk AI needs an internet connection. Check your network and try again.</p>
<button onclick="location.reload()">Retry</button>
</div>
</body>
</html>
